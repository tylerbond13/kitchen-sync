<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- Placeholder "Judge" avatar — generic cartoon, no real-person likeness.
       Replace with assets/images/hd/ks-char-judge-judy.png when ready. -->
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3550"/>
      <stop offset="1" stop-color="#272238"/>
    </linearGradient>
  </defs>
  <!-- robe / body -->
  <path d="M44 260 C44 196 60 168 100 168 C140 168 156 196 156 260 Z" fill="url(#robe)"/>
  <!-- white judge collar -->
  <path d="M86 170 L100 200 L114 170 L128 178 L122 230 L78 230 L72 178 Z" fill="#fdfbf6"/>
  <path d="M100 200 L94 172 L106 172 Z" fill="#e9e3d6"/>
  <!-- neck -->
  <rect x="90" y="150" width="20" height="26" rx="9" fill="#f3c8a0"/>
  <!-- head -->
  <circle cx="100" cy="116" r="42" fill="#f7d2ad"/>
  <!-- hair (soft grey-blonde bob) -->
  <path d="M58 116 C56 78 80 60 100 60 C120 60 144 78 142 116 C142 96 128 92 128 92 C130 104 126 112 126 112 L126 86 C112 80 88 80 74 86 L74 112 C74 112 70 104 72 92 C72 92 58 96 58 116 Z" fill="#d9d2c4"/>
  <!-- glasses -->
  <circle cx="84" cy="116" r="13" fill="none" stroke="#2d2238" stroke-width="3"/>
  <circle cx="116" cy="116" r="13" fill="none" stroke="#2d2238" stroke-width="3"/>
  <line x1="97" y1="115" x2="103" y2="115" stroke="#2d2238" stroke-width="3"/>
  <!-- eyes -->
  <circle cx="84" cy="116" r="3.4" fill="#2d1634"/>
  <circle cx="116" cy="116" r="3.4" fill="#2d1634"/>
  <!-- brows (a touch stern) -->
  <path d="M74 102 Q84 98 94 103" stroke="#9a9384" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M106 103 Q116 98 126 102" stroke="#9a9384" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- mouth -->
  <path d="M88 138 Q100 144 112 138" stroke="#9c5a52" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- gavel -->
  <g transform="rotate(-24 150 196)">
    <rect x="138" y="186" width="40" height="18" rx="6" fill="#b9824a"/>
    <rect x="154" y="200" width="9" height="40" rx="4" fill="#a06a34"/>
    <rect x="150" y="184" width="6" height="22" rx="3" fill="#8a5a2c"/>
  </g>
</svg>
